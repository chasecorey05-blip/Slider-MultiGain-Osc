<!DOCTYPE html>

<body>

    <input id = "gain1" type="range" min="0" max="1" step="0.001" value="0.0"><label id="gainDisplay1">GainLevel_1</label>
    <input id = "gain2" type="range" min="0" max="1" step="0.001" value="0.0"><label id="gainDisplay2">GainLevel_2</label>
    <input id = "gain3" type="range" min="0" max="1" step="0.001" value="0.0"><label id="gainDisplay3">GainLevel_3</label>
   <input id = "gain4" type="range" min="0" max="1" step="0.001" value="0.0"><label id="gainDisplay4">GainLevel_4</label>
   <input id = "gain5" type="range" min="0" max="1" step="0.001" value="0.0"><label id="gainDisplay5">GainLevel_5</label>
   <input id = "gain6" type="range" min="0" max="1" step="0.001" value="0.0"><label id="gainDisplay6">GainLevel_6</label>
   

    <script>
        const ctx = new AudioContext();
        ctx.suspend();

        const osc1 = new OscillatorNode(ctx);
        let freq = 110
        osc1.frequency.value = freq
       
        const osc2 = new OscillatorNode(ctx);
        osc2.frequency.value = freq * 1.01
        const osc3 = new OscillatorNode(ctx);
        osc3.frequency.value = freq * 0.99
        
        
        
        const gain = new GainNode(ctx);
        gain.gain.value = 0.0;

        osc1.connect(gain);
        osc2.connect(gain);
        osc3.connect(gain);
        gain.connect(ctx.destination);
        osc1.start();
        osc2.start();
        osc3.start();

        const slider1 = document.querySelector("#gain1");
        slider1.addEventListener("input", () => {
            ctx.resume();
        gain.gain.value = Number(slider1.value);
        document.querySelector("gainDisplay1").textContent = slider1.value;
    });

        //const ctx = new AudioContext();
